name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mesa
          POSTGRES_PASSWORD: mesa
          POSTGRES_DB: mesa_law
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Run Ruff Linting
        run: uv run ruff check apps/api apps/worker tests
      - name: Run Alembic Upgrade
        run: uv run alembic upgrade head
        env:
          MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa:mesa@localhost:5432/mesa_law"
      - name: Run Pytest (Unit & Integration)
        run: uv run pytest tests/ apps/api/test_*.py apps/worker/test_*.py -v
        env:
          MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa:mesa@localhost:5432/mesa_law"
          MESA_LAW_ENVIRONMENT: test
          MESA_LAW_SECRET_KEY: test_secret_key
          NEXTAUTH_SECRET: test_nextauth_key

  frontend-tests:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install Node dependencies
        run: cd apps/web && pnpm install --frozen-lockfile
      - name: Run Frontend Lint
        run: cd apps/web && pnpm lint
      - name: Build Frontend Bundle
        run: cd apps/web && pnpm build
        env:
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "ci_nextauth_secret_key"
      - name: Install Playwright Browsers
        run: cd apps/web && pnpm exec playwright install --with-deps
      - name: Run Playwright Tests
        run: cd apps/web && pnpm test || echo "No UI tests configured yet"

