name: MESA Law CI/CD Quality Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and Format (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
          
      - name: Typecheck (Mypy)
        run: uv run mypy apps

      - name: Compile check
        run: python -m compileall apps tests

      - name: Run Pytest
        env:
          MESA_LAW_ENVIRONMENT: test
        run: uv run pytest apps tests -v

  frontend-quality:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test:unit

      - name: E2E Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  database-migrations:
    name: Database Migration Integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mesa_law
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mesa_law_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test Upgrade to Head
        env:
          DATABASE_URL: "postgresql+psycopg://mesa_law:password@localhost:5432/mesa_law_db"
          MESA_LAW_ENVIRONMENT: test
        run: uv run alembic upgrade head

      - name: Test Downgrade
        env:
          DATABASE_URL: "postgresql+psycopg://mesa_law:password@localhost:5432/mesa_law_db"
          MESA_LAW_ENVIRONMENT: test
        run: uv run alembic downgrade -1

      - name: Test Upgrade to Head (Re-apply)
        env:
          DATABASE_URL: "postgresql+psycopg://mesa_law:password@localhost:5432/mesa_law_db"
          MESA_LAW_ENVIRONMENT: test
        run: uv run alembic upgrade head

  integration-smoke-test:
    name: Integration & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Compose Stack
        run: docker compose --profile core build
        
      - name: Start Docker Compose Stack
        run: docker compose --profile core up -d
        
      - name: Wait for services
        run: sleep 15
        
      - name: Check container statuses
        run: docker compose --profile core ps

  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -t mesa-law-api:local -f docker/api.Dockerfile .
        
      - name: Run Trivy vulnerability scanner on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mesa-law-api:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'spdx-json'
          output: 'sbom.spdx.json'
