name: MESA Law CI/CD Quality Gates

on:
  push:
    branches: [ "master", "codex/mesa-v4-mvp" ]
  pull_request:
    branches: [ "master" ]

jobs:
  backend-quality:
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mesa_law
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mesa_law_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and Format (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Security static analysis
        run: >-
          uv run bandit -q -r apps
          -x 'apps/api/test_*.py,apps/worker/test_*.py'
          -c pyproject.toml
          
      - name: Typecheck (Mypy)
        run: uv run mypy apps

      - name: Compile check
        run: python -m compileall apps tests

      - name: OpenAPI drift
        env:
          MESA_LAW_ENVIRONMENT: test
        run: uv run python scripts/export_openapi.py --check

      - name: Upgrade isolated test database
        env:
          MESA_LAW_ENVIRONMENT: test
          MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law:password@localhost:5432/mesa_law_db"
        run: uv run alembic upgrade head

      - name: Run Pytest
        env:
          MESA_LAW_ENVIRONMENT: test
          MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law:password@localhost:5432/mesa_law_db"
        run: uv run pytest apps tests --ignore=tests/e2e -v

  frontend-quality:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generated API client drift
        run: |
          pnpm api:generate
          git diff --exit-code -- src/api

      - name: Unit Tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  database-migrations:
    name: Database Migration Integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mesa_law
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mesa_law_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test Upgrade to Head
        env:
          MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law:password@localhost:5432/mesa_law_db"
          MESA_LAW_ENVIRONMENT: test
        run: uv run alembic upgrade head

      - name: Test Downgrade
        env:
          MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law:password@localhost:5432/mesa_law_db"
          MESA_LAW_ENVIRONMENT: test
        run: uv run alembic downgrade -1

      - name: Test Upgrade to Head (Re-apply)
        env:
          MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law:password@localhost:5432/mesa_law_db"
          MESA_LAW_ENVIRONMENT: test
        run: uv run alembic upgrade head

  integration-smoke-test:
    name: Integration & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral Compose credentials
        env:
          CI: "true"
        run: python scripts/write_ci_env.py
      
      - name: Build Docker Compose Stack
        run: docker compose --profile core build
        
      - name: Start Docker Compose Stack
        run: docker compose --profile core up -d --wait --wait-timeout 180
        
      - name: Check container statuses
        run: docker compose --profile core ps

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Backend E2E Tests
        env:
          MESA_LAW_ENVIRONMENT: test
        run: uv run pytest tests/e2e -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps

      - name: Release Compose web port for Law-side stub
        run: docker compose --profile core stop web

      - name: Run Playwright E2E Tests
        working-directory: apps/web
        run: pnpm test

  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -t mesa-law-api:local -f docker/api.Dockerfile .
        
      - name: Run Trivy vulnerability scanner on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mesa-law-api:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'spdx-json'
          output: 'sbom.spdx.json'
