name: mesa-law-lite

x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER:-mesa}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa}
  POSTGRES_DB: ${POSTGRES_DB:-mesa_law}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law_app:app_pass@postgres:5432/${POSTGRES_DB:-mesa_law}"
  MESA_LAW_STORAGE_ENDPOINT: "http://minio:9000"
  MESA_LAW_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:-admin}"
  MESA_LAW_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-password123}"
  MESA_LAW_SECRET_KEY: "supersecret_dev_key"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mesa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa}
      POSTGRES_DB: ${POSTGRES_DB:-mesa_law}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 admin password123;
      /usr/bin/mc mb myminio/mesa-law-docs --ignore-existing;
      exit 0;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-mesa_law}
      KC_DB_USERNAME: ${POSTGRES_USER:-mesa}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-mesa}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/keycloak-realm.json:/opt/keycloak/data/import/keycloak-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3  "]
      interval: 15s
      timeout: 10s
      retries: 10

  db-migration:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *common-env
      MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law_migrator:migrator_pass@postgres:5432/${POSTGRES_DB:-mesa_law}"
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  legal-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *common-env
      MESA_LAW_KEYCLOAK_ISSUER: "http://localhost:8080/realms/mesa_law"
      MESA_LAW_KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/mesa_law/protocol/openid-connect/certs"
      KEYCLOAK_CLIENT_ID: "mesa-client"
      KEYCLOAK_CLIENT_SECRET: "mesa-client-secret"
      MESA_LAW_SKIP_CLAMAV: "true"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M

  legal-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      <<: *common-env
      MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law_worker:worker_pass@postgres:5432/${POSTGRES_DB:-mesa_law}"
      MESA_LAW_SKIP_CLAMAV: "true"
      MESA_LAW_WORKER_CONCURRENCY: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "supersecret_nextauth_key_for_dev_only"
      KEYCLOAK_PUBLIC_ISSUER: "http://localhost:8080/realms/mesa_law"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/mesa_law/protocol/openid-connect/certs"
      KEYCLOAK_CLIENT_ID: "mesa-client"
      KEYCLOAK_CLIENT_SECRET: "mesa-client-secret"
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres-data:
  redis-data:
  minio-data:
