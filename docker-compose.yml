name: mesa-law

x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER:-mesa}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa}
  POSTGRES_DB: ${POSTGRES_DB:-mesa_law}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  MESA_LAW_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-mesa}:${POSTGRES_PASSWORD:-mesa}@postgres:5432/${POSTGRES_DB:-mesa_law}"
  MESA_LAW_STORAGE_ENDPOINT: "http://minio:9000"
  MESA_LAW_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:-admin}"
  MESA_LAW_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-password123}"
  MESA_LAW_SECRET_KEY: "supersecret_dev_key"

services:
  # ---------------------------------------------------------
  # Core Infrastructure
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mesa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa}
      POSTGRES_DB: ${POSTGRES_DB:-mesa_law}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bootstrap:
    image: minio/mc
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 admin password123;
      /usr/bin/mc mb myminio/mesa-law-docs --ignore-existing;
      exit 0;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    profiles: ["core"]
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-mesa_law}
      KC_DB_USERNAME: ${POSTGRES_USER:-mesa}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-mesa}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/keycloak-realm.json:/opt/keycloak/data/import/keycloak-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3  "]
      interval: 15s
      timeout: 10s
      retries: 10

  clamav:
    image: clamav/clamav:latest
    profiles: ["core"]
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "127.0.0.1:3310"]
      interval: 30s
      timeout: 10s
      retries: 5

  caddy:
    image: caddy:2-alpine
    profiles: ["core"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

  # ---------------------------------------------------------
  # Observability (OTel/Grafana Stack)
  # ---------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector:latest
    profiles: ["core"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  prometheus:
    image: prom/prometheus:latest
    profiles: ["core"]
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["core"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

  loki:
    image: grafana/loki:latest
    profiles: ["core"]
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:latest
    profiles: ["core"]
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"

  # ---------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------
  db-migration:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["core"]
    environment:
      <<: *common-env
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  legal-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["core"]
    environment:
      <<: *common-env
      MESA_LAW_KEYCLOAK_ISSUER: "http://keycloak:8080/realms/mesa_law"
      MESA_LAW_KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/mesa_law/protocol/openid-connect/certs"
      KEYCLOAK_CLIENT_ID: "mesa-client"
      KEYCLOAK_CLIENT_SECRET: "mesa-client-secret"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  legal-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    profiles: ["core"]
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    profiles: ["core"]
    environment:
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "supersecret_nextauth_key_for_dev_only"
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/mesa_law"
      KEYCLOAK_CLIENT_ID: "mesa-client"
      KEYCLOAK_CLIENT_SECRET: "mesa-client-secret"
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  prometheus-data:
  grafana-data:
