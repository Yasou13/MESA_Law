name: mesa-law

x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER:-mesa}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-mesa_law}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law_app:${MESA_LAW_APP_DB_PASSWORD:?Set MESA_LAW_APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mesa_law}"
  MESA_LAW_STORAGE_ENDPOINT: "http://minio:9000"
  MESA_LAW_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}"
  MESA_LAW_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
  MESA_LAW_SECRET_KEY: "${MESA_LAW_SECRET_KEY:?Set MESA_LAW_SECRET_KEY in .env}"
  MESA_LAW_ENVIRONMENT: "${MESA_LAW_ENVIRONMENT:-development}"
  MESA_LAW_TEST_AUTH_ENABLED: "${MESA_LAW_TEST_AUTH_ENABLED:-false}"
  MESA_LAW_CLAMAV_REQUIRED: "true"
  MESA_LAW_INTELLIGENCE_ADAPTER: "${MESA_LAW_INTELLIGENCE_ADAPTER:-mock}"
  MESA_LAW_MESA_BACKEND_URL: "${MESA_LAW_MESA_BACKEND_URL:-http://host.docker.internal:8000}"
  MESA_LAW_MESA_API_KEY: "${MESA_LAW_MESA_API_KEY:-}"
  MESA_LAW_OBSERVABILITY_ENABLED: "${MESA_LAW_OBSERVABILITY_ENABLED:-false}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

services:
  # ---------------------------------------------------------
  # Core Infrastructure
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mesa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mesa_law}
      MESA_LAW_APP_DB_PASSWORD: ${MESA_LAW_APP_DB_PASSWORD:?Set MESA_LAW_APP_DB_PASSWORD in .env}
      MESA_LAW_WORKER_DB_PASSWORD: ${MESA_LAW_WORKER_DB_PASSWORD:?Set MESA_LAW_WORKER_DB_PASSWORD in .env}
      MESA_LAW_MIGRATOR_DB_PASSWORD: ${MESA_LAW_MIGRATOR_DB_PASSWORD:?Set MESA_LAW_MIGRATOR_DB_PASSWORD in .env}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesa"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  minio-bootstrap:
    image: minio/mc:RELEASE.2024-03-30T11-44-32Z
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb myminio/mesa-law-docs --ignore-existing;
      exit 0;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    profiles: ["core"]
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-mesa}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30"
    volumes:
      - ./docker/keycloak-realm.json:/opt/keycloak/data/import/keycloak-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3  "]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1280M

  clamav:
    image: clamav/clamav:1.3.1
    profiles: ["core"]
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "127.0.0.1:3310"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

  # ---------------------------------------------------------
  # Observability (OTel/Grafana Stack)
  # ---------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector:0.97.0
    profiles: ["observability"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.51.0
    profiles: ["observability"]
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:10.4.1
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

  loki:
    image: grafana/loki:2.9.5
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:2.4.0
    profiles: ["observability"]
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "127.0.0.1:3200:3200"

  # ---------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------
  db-migration:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["core"]
    environment:
      <<: *common-env
      MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law_migrator:${MESA_LAW_MIGRATOR_DB_PASSWORD:?Set MESA_LAW_MIGRATOR_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mesa_law}"
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  legal-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["core"]
    environment:
      <<: *common-env
      MESA_LAW_KEYCLOAK_ISSUER: "http://localhost:8080/realms/mesa_law"
      MESA_LAW_KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/mesa_law/protocol/openid-connect/certs"
      MESA_LAW_KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_CLIENT_ID: "mesa-client"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M

  legal-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    profiles: ["core"]
    environment:
      <<: *common-env
      MESA_LAW_DATABASE_URL: "postgresql+psycopg://mesa_law_worker:${MESA_LAW_WORKER_DB_PASSWORD:?Set MESA_LAW_WORKER_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mesa_law}"
      MESA_LAW_WORKER_CONCURRENCY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    profiles: ["core"]
    environment:
      MESA_LAW_ENVIRONMENT: "${MESA_LAW_ENVIRONMENT:-development}"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}"
      KEYCLOAK_PUBLIC_ISSUER: "http://localhost:8080/realms/mesa_law"
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/mesa_law/protocol/openid-connect/certs"
      KEYCLOAK_CLIENT_ID: "mesa-client"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}"
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  prometheus-data:
  grafana-data:
