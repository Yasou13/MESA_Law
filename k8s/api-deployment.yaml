apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesa-law-api
  labels:
    app: mesa-law-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mesa-law-api
  template:
    metadata:
      labels:
        app: mesa-law-api
    spec:
      containers:
      - name: api
        image: mesa-law-api:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: mesa-law-secrets
        - configMapRef:
            name: mesa-law-config
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mesa-law-api
spec:
  selector:
    app: mesa-law-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
