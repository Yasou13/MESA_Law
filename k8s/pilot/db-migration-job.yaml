apiVersion: batch/v1
kind: Job
metadata:
  name: mesa-law-db-migration
  namespace: mesa-law-pilot
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      containers:
        - name: db-migration
          image: mesa-law-api:latest
          command: ["uv", "run", "alembic", "upgrade", "head"]
          env:
            - name: MESA_ENV
              value: "pilot"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mesa-law-credentials-native
                  key: DATABASE_URL
      restartPolicy: Never
  backoffLimit: 3
