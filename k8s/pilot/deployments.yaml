apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesa-law-api
  namespace: mesa-law-pilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mesa-law
      component: api
  template:
    metadata:
      labels:
        app: mesa-law
        component: api
    spec:
      containers:
        - name: api
          image: mesa-law-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: MESA_LAW_ENVIRONMENT
              value: "pilot"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mesa-law-credentials-native
                  key: DATABASE_URL
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mesa-law-credentials-native
                  key: KEYCLOAK_CLIENT_SECRET
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mesa-law-credentials-native
                  key: MINIO_SECRET_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesa-law-worker
  namespace: mesa-law-pilot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mesa-law
      component: worker
  template:
    metadata:
      labels:
        app: mesa-law
        component: worker
    spec:
      containers:
        - name: worker
          image: mesa-law-worker:latest
          env:
            - name: MESA_LAW_ENVIRONMENT
              value: "pilot"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mesa-law-credentials-native
                  key: DATABASE_URL
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mesa-law-credentials-native
                  key: MINIO_SECRET_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesa-law-web
  namespace: mesa-law-pilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mesa-law
      component: web
  template:
    metadata:
      labels:
        app: mesa-law
        component: web
    spec:
      containers:
        - name: web
          image: mesa-law-web:latest
          ports:
            - containerPort: 3000
