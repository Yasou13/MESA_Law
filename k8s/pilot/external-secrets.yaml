apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cloud-secret-manager
  namespace: mesa-law-pilot
spec:
  provider:
    # Example using AWS Secrets Manager. Can be swapped for Azure KeyVault, Google Secret Manager, or HashiCorp Vault.
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: mesa-law-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mesa-law-secrets
  namespace: mesa-law-pilot
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: cloud-secret-manager
    kind: SecretStore
  target:
    name: mesa-law-credentials-native
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: pilot/mesa-law-secrets
        property: database_url
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: pilot/mesa-law-secrets
        property: keycloak_client_secret
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: pilot/mesa-law-secrets
        property: minio_secret_key
