apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesa-law-web
  labels:
    app: mesa-law-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mesa-law-web
  template:
    metadata:
      labels:
        app: mesa-law-web
    spec:
      containers:
      - name: web
        image: mesa-law-web:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: mesa-law-secrets
        - configMapRef:
            name: mesa-law-config
        readinessProbe:
          httpGet:
            path: /api/auth/providers
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mesa-law-web
spec:
  selector:
    app: mesa-law-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
