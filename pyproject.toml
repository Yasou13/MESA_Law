[project]
name = "mesa-law"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.5",
    "fastapi>=0.140.0",
    "fastapi-csrf-protect>=1.0.7",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.51",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.51.0",
    "httpx>=0.28.1",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
src = ["apps/api", "apps/worker", "tests"]
exclude = [
    ".venv",
    "node_modules",
    "migrations/versions",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
ignore = [
    "B008",   # Depends() in function defaults is the FastAPI pattern
]
